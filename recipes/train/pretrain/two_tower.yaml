# @package trainer

_trainer_: lcm.train.two_tower_diffusion_lcm.trainer.prepare_two_tower_diffusion_lcm_trainer

output_dir: ??

#Parameter Size: 1,635,101,696
model_arch: two_tower_diffusion_lcm_1_6B 

criterion:
  name: two_tower_diffusion_next_sent
  cf_guidance_probability: 0.15
  reduction: sum
  log_losses_per_timestep_bucket: True
  compute_rmse: False
  step_sampling:
    sampling: "uniform"
    weighting: "none"

dtype: "torch.float16"
use_optimizer_in_fp32: true
use_fsdp: true
fsdp_fp32_reduce: true

lr: 0.0004
lr_schedule: cosine
num_lr_warmup_steps: 10_000
max_steps: 250_001
gradient_accumulation: 1
max_grad_norm: 25
weight_decay: 0.1
adam_betas:
  - 0.9
  - 0.95
adam_eps: 1e-5

validate_every_n_steps: 300_000
save_model_every_n_steps: 5_000
checkpoint_every_n_steps: 5_000
keep_last_n_checkpoints: 100
preserve_consolidated_models: True
publish_metrics_every_n_steps: 10

seed: 1
profile: false

data_loading_config:
  multiple_dataset_chaining: "sample"
  max_tokens: 14372
  min_batch_size: 1
  len_to_wrap_long_seq: 128
  packing: false
  min_length_of_sequences: 1
  min_length_after_batching: 2
  num_parallel_calls: 1
  nb_prefetch: 5
  nb_epochs: 1
  max_sentence_len_in_doc: 300
  max_sentence_len_in_target_doc: 300

validation_data_loading_config:
  len_to_wrap_long_seq: 128

